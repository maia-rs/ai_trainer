<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AITrainer{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    crossorigin="anonymous" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-base:    #0d0f14;
      --bg-card:    #13161e;
      --bg-card-2:  #191c26;
      --accent:     #4f6ef7;
      --accent-2:   #7c3aed;
      --text-main:  #e8eaf0;
      --text-muted: #6b7280;
      --border:     rgba(255,255,255,.06);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Navbar ─────────────────────────────────────────── */
    .ai-navbar {
      background: rgba(13,15,20,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: .75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .ai-navbar img { height: 56px; }
    .ai-navbar .user-badge {
      margin-left: auto;
      font-size: .8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    /* ── Cards ──────────────────────────────────────────── */
    .ai-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
    }

    /* ── KPI cards ──────────────────────────────────────── */
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 14px 14px 0 0;
    }
    .kpi-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(79,110,247,.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: .75rem;
    }
    .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text-main);
    }
    .kpi-label {
      font-size: .72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: .3rem;
    }
    .kpi-delta { font-size: .78rem; margin-top: .4rem; }
    .delta-pos { color: #34d399; }
    .delta-neg { color: #f87171; }

    /* ── Section title ──────────────────────────────────── */
    .section-title {
      font-size: .72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .section-title i { color: var(--accent); font-size: .9rem; }

    /* ── Tables ─────────────────────────────────────────── */
    .ai-table { width: 100%; border-collapse: collapse; }
    .ai-table thead th {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      padding: .5rem .75rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .ai-table tbody td {
      padding: .6rem .75rem;
      font-size: .875rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }
    .ai-table tbody tr:last-child td { border-bottom: none; }
    .ai-table tbody tr:hover td { background: rgba(255,255,255,.03); }

    /* ── Chart container ────────────────────────────────── */
    .chart-wrap { position: relative; height: 220px; }

    /* ── Treino badge ───────────────────────────────────── */
    .treino-badge {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .6rem .9rem;
    }
    .treino-badge .t-name { font-weight: 600; font-size: .875rem; }
    .treino-badge .t-day  { font-size: .75rem; color: var(--text-muted); }

    /* ── Empty state ────────────────────────────────────── */
    .empty { color: var(--text-muted); font-size: .875rem; padding: .5rem 0; }

    canvas { display: block; }
  </style>
</head>
<body>

  <nav class="ai-navbar">
    <img src="/static/logo.png" alt="AITrainer" />
    {% if usuario_nome %}
    <div class="user-badge">
      <i class="bi bi-person-circle"></i>
      <span>{{ usuario_nome }}</span>
    </div>
    {% endif %}
  </nav>

  <div class="container-fluid px-3 px-md-4 py-4" style="max-width:1280px; margin:0 auto;">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
