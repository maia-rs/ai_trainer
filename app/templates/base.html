<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AITrainer{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    crossorigin="anonymous" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-base:    #0d0f14;
      --bg-card:    #13161e;
      --bg-card-2:  #191c26;
      --accent:     #4f6ef7;
      --accent-2:   #7c3aed;
      --text-main:  #e8eaf0;
      --text-muted: #6b7280;
      --border:     rgba(255,255,255,.06);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Navbar ─────────────────────────────────────────── */
    .ai-navbar {
      background: rgba(13,15,20,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: .75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .ai-navbar img { height: 56px; }
    .ai-navbar .user-badge {
      margin-left: auto;
      font-size: .8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    /* ── Cards ──────────────────────────────────────────── */
    .ai-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
    }

    /* ── KPI cards ──────────────────────────────────────── */
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 14px 14px 0 0;
    }
    .kpi-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(79,110,247,.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: .75rem;
    }
    .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text-main);
    }
    .kpi-label {
      font-size: .72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: .3rem;
    }
    .kpi-delta { font-size: .78rem; margin-top: .4rem; }
    .delta-pos { color: #34d399; }
    .delta-neg { color: #f87171; }

    /* ── Section title ──────────────────────────────────── */
    .section-title {
      font-size: .72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .section-title i { color: var(--accent); font-size: .9rem; }

    /* ── Tables ─────────────────────────────────────────── */
    .ai-table { width: 100%; border-collapse: collapse; }
    .ai-table thead th {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      padding: .5rem .75rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .ai-table tbody td {
      padding: .6rem .75rem;
      font-size: .875rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }
    .ai-table tbody tr:last-child td { border-bottom: none; }
    .ai-table tbody tr:hover td { background: rgba(255,255,255,.03); }

    /* ── Chart container ────────────────────────────────── */
    .chart-wrap { position: relative; height: 220px; }

    /* ── Treino badge ───────────────────────────────────── */
    .treino-badge {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .6rem .9rem;
    }
    .treino-badge .t-name { font-weight: 600; font-size: .875rem; }
    .treino-badge .t-day  { font-size: .75rem; color: var(--text-muted); }

    /* ── Empty state ────────────────────────────────────── */
    .empty { color: var(--text-muted); font-size: .875rem; padding: .5rem 0; }

    /* ── Progress Metrics ───────────────────────────────── */
    .progress-metric {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .progress-metric:hover { 
      background: rgba(255,255,255,.02); 
      border-color: rgba(255,255,255,.1);
    }
    
    .metric-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .metric-icon.streak { background: rgba(251,146,60,.15); color: #fb923c; }
    .metric-icon.frequency { background: rgba(79,110,247,.15); color: #4f6ef7; }
    .metric-icon.volume { background: rgba(52,211,153,.15); color: #34d399; }
    .metric-icon.target { background: rgba(168,139,250,.15); color: #a78bfa; }
    
    .metric-content { flex: 1; min-width: 0; }
    .metric-value { 
      font-size: 1.25rem; 
      font-weight: 700; 
      line-height: 1.2; 
      color: var(--text-main); 
    }
    .metric-label { 
      font-size: .7rem; 
      color: var(--text-muted); 
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-top: .1rem;
    }
    .metric-change {
      font-size: .65rem;
      margin-top: .2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .2rem;
    }
    .metric-change.positive { color: #34d399; }
    .metric-change.negative { color: #f87171; }
    
    /* ── Weekly Progress Bar ────────────────────────────── */
    .weekly-progress-bar { margin-top: 1.2rem; }
    .progress-bar-container {
      height: 8px;
      background: rgba(255,255,255,.05);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: .5rem;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 4px;
      transition: width 0.6s ease-out;
      box-shadow: 0 0 8px rgba(79,110,247,.4);
    }
    .progress-bar-label {
      font-size: .7rem;
      color: var(--text-muted);
      text-align: center;
    }
    
    /* ── Badge Info ─────────────────────────────────────── */
    .treino-info {
      margin-bottom: .75rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .badge-info {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .25rem .5rem;
      background: rgba(79,110,247,.1);
      color: var(--accent);
      border-radius: 4px;
      font-size: .65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .badge-info i { font-size: .7rem; }

    canvas { display: block; }
    
    /* ── Responsive Design ──────────────────────────────── */
    @media (max-width: 768px) {
      .container-fluid { padding-left: 1rem; padding-right: 1rem; }
      
      .ai-navbar {
        padding: .5rem 1rem;
        flex-direction: row;
        align-items: center;
      }
      .ai-navbar img { height: 40px; }
      .ai-navbar .user-badge { 
        font-size: .7rem;
        margin-left: auto;
      }
      
      .kpi-card { padding: 1rem; }
      .kpi-value { font-size: 1.75rem; }
      .kpi-label { font-size: .65rem; }
      
      .progress-metric { 
        padding: .6rem; 
        gap: .6rem;
      }
      .metric-icon { width: 32px; height: 32px; font-size: .9rem; }
      .metric-value { font-size: 1.1rem; }
      .metric-label { font-size: .65rem; }
      
      .section-title { font-size: .68rem; margin-bottom: .75rem; }
      .ai-card { padding: 1rem 1.25rem; }
      
      .chart-wrap { height: 200px; }
      
      .treino-info { margin-bottom: .5rem; }
      .badge-info { 
        font-size: .6rem; 
        padding: .2rem .4rem;
      }
      
      .ai-table thead th { font-size: .65rem; padding: .4rem .6rem; }
      .ai-table tbody td { font-size: .8rem; padding: .5rem .6rem; }
      
      .treino-badge { padding: .5rem .7rem; }
      .treino-badge .t-name { font-size: .8rem; }
      .treino-badge .t-day { font-size: .7rem; }
    }
    
    @media (max-width: 480px) {
      .kpi-card { padding: .75rem; }
      .kpi-value { font-size: 1.5rem; }
      .kpi-icon { width: 32px; height: 32px; font-size: 1rem; }
      
      .progress-metric { 
        flex-direction: column; 
        text-align: center; 
        gap: .4rem;
      }
      .metric-content { text-align: center; }
      
      .chart-wrap { height: 180px; }
      .ai-card { padding: .75rem 1rem; }
      
      .treino-info { justify-content: center; }
      
      /* Stack KPIs vertically on very small screens */
      .row.g-3.mb-4 .col-6:nth-child(n+3) { margin-top: .75rem; }
    }
  </style>
</head>
<body>

  <nav class="ai-navbar">
    <img src="/static/logo.png" alt="AITrainer" />
    {% if usuario_nome %}
    <div class="user-badge">
      <i class="bi bi-person-circle"></i>
      <span>{{ usuario_nome }}</span>
    </div>
    {% endif %}
  </nav>

  <div class="container-fluid px-3 px-md-4 py-4" style="max-width:1280px; margin:0 auto;">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
